<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="favicon-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C8F542"/>
      <stop offset="100%" style="stop-color:#42F5D4"/>
    </linearGradient>
  </defs>
  
  <!-- Fondo oscuro -->
  <rect width="100" height="100" fill="#0C0F14" rx="20"/>
  
  <!-- Círculo Ground Zero -->
  <circle
    cx="50"
    cy="50"
    r="32"
    fill="none"
    stroke="url(#favicon-gradient)"
    stroke-width="6"
    stroke-linecap="round"
    stroke-dasharray="180 20"
    stroke-dashoffset="10"
  />
  
  <!-- Punto de apertura -->
  <circle cx="50" cy="18" r="4" fill="#C8F542"/>
</svg>
