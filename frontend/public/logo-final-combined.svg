<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <defs>
    <linearGradient id="lime-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#C8F542"/>
      <stop offset="100%" style="stop-color:#42F5D4"/>
    </linearGradient>
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   style="stop-color:#0C0F14"/>
      <stop offset="100%" style="stop-color:#080B10"/>
    </linearGradient>
    <filter id="arc-glow">
      <feGaussianBlur stdDeviation="3.5" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dot-glow">
      <feGaussianBlur stdDeviation="2" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="text-crisp">
      <feGaussianBlur stdDeviation="0.4" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fondo azul pizarra oscuro (B) -->
  <rect width="800" height="360" fill="url(#bg-dark)"/>

  <!-- ══ SÍMBOLO: arco geométrico del logo B ══ -->

  <!-- Anillo guía exterior muy tenue -->
  <circle cx="154" cy="180" r="106" fill="none" stroke="#1A2535" stroke-width="1"/>

  <!-- Arco principal gradiente lima→cian, trazo grueso, incompleto -->
  <circle cx="154" cy="180" r="84"
          fill="none"
          stroke="url(#lime-cyan)"
          stroke-width="17"
          stroke-linecap="round"
          stroke-dasharray="472 58"
          stroke-dashoffset="29"
          filter="url(#arc-glow)"/>

  <!-- Hueco interior del cero — fondo oscuro -->
  <ellipse cx="154" cy="180" rx="42" ry="52" fill="#0C0F14"/>

  <!-- Punto de apertura del arco — dot lima -->
  <circle cx="154" cy="96" r="8.5" fill="#C8F542" filter="url(#dot-glow)"/>

  <!-- Líneas de construcción (detalle técnico sutil) -->
  <line x1="154" y1="84"  x2="154" y2="58"  stroke="#1A2840" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="238" y1="180" x2="264" y2="180" stroke="#1A2840" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- Cruz de registro en el centro -->
  <line x1="146" y1="180" x2="162" y2="180" stroke="#C8F542" stroke-width="1.2" opacity="0.4"/>
  <line x1="154" y1="172" x2="154" y2="188" stroke="#C8F542" stroke-width="1.2" opacity="0.4"/>

  <!-- ══ TEXTO PRINCIPAL (estructura del E) ══ -->

  <!-- "ground" — gris frío, tracking amplio -->
  <text x="292" y="148"
        fill="#5A7A9A"
        font-size="16"
        font-family="'Trebuchet MS', 'Gill Sans', sans-serif"
        font-weight="400"
        letter-spacing="11">ground</text>

  <!-- "Zero" — blanco cálido, peso 700, gran tamaño -->
  <text x="286" y="224"
        fill="#E8EDF5"
        font-size="78"
        font-family="'Trebuchet MS', 'Gill Sans', sans-serif"
        font-weight="700"
        letter-spacing="-3"
        filter="url(#text-crisp)">Zero</text>

  <!-- Barra de acento gradiente bajo el nombre -->
  <rect x="286" y="238" width="44" height="3" fill="url(#lime-cyan)" rx="1"/>

  <!-- "development" — gris medio, tracking controlado -->
  <text x="286" y="270"
        fill="#445E78"
        font-size="13"
        font-family="'Trebuchet MS', 'Gill Sans', sans-serif"
        font-weight="400"
        letter-spacing="6">development</text>

  <!-- ══ PANEL DERECHO: stack de servicios (del E) ══ -->

  <!-- Línea separadora vertical -->
  <line x1="654" y1="105" x2="654" y2="275" stroke="#141C28" stroke-width="1"/>

  <text x="672" y="143"
        fill="#2A3D55" font-size="9"
        font-family="'Trebuchet MS', sans-serif"
        letter-spacing="4">SOFTWARE</text>
  <line x1="672" y1="151" x2="762" y2="151" stroke="#141C28" stroke-width="0.8"/>

  <text x="672" y="167"
        fill="#2A3D55" font-size="9"
        font-family="'Trebuchet MS', sans-serif"
        letter-spacing="4">DESIGN</text>
  <line x1="672" y1="175" x2="762" y2="175" stroke="#141C28" stroke-width="0.8"/>

  <text x="672" y="191"
        fill="#2A3D55" font-size="9"
        font-family="'Trebuchet MS', sans-serif"
        letter-spacing="4">SOLUTIONS</text>

  <!-- Barra acento decorativa bajo el stack -->
  <rect x="672" y="202" width="22" height="2" fill="url(#lime-cyan)" rx="1"/>

  <!-- ══ LÍNEA BASE + PIE ══ -->
  <line x1="60" y1="318" x2="740" y2="318" stroke="#141C28" stroke-width="1"/>

  <text x="60" y="338"
        fill="#1E2D3D" font-size="9"
        font-family="'Trebuchet MS', sans-serif"
        letter-spacing="4">GROUNDZERO.DEV</text>

  <text x="740" y="338" text-anchor="end"
        fill="#1E2D3D" font-size="9"
        font-family="'Trebuchet MS', sans-serif"
        letter-spacing="3">© 2024</text>

  <!-- Grid de puntos decorativo (del B) -->
  <g opacity="0.12">
    <circle cx="580" cy="108" r="1.8" fill="#C8F542"/>
    <circle cx="604" cy="108" r="1.8" fill="#C8F542"/>
    <circle cx="628" cy="108" r="1.8" fill="#C8F542"/>
    <circle cx="580" cy="132" r="1.8" fill="#C8F542"/>
    <circle cx="604" cy="132" r="1.8" fill="#C8F542"/>
    <circle cx="628" cy="132" r="1.8" fill="#C8F542"/>
    <circle cx="580" cy="156" r="1.8" fill="#C8F542"/>
    <circle cx="604" cy="156" r="1.8" fill="#C8F542"/>
    <circle cx="628" cy="156" r="1.8" fill="#C8F542"/>
    <circle cx="580" cy="180" r="1.8" fill="#C8F542"/>
    <circle cx="604" cy="180" r="1.8" fill="#C8F542"/>
    <circle cx="628" cy="180" r="1.8" fill="#C8F542"/>
    <circle cx="580" cy="204" r="1.8" fill="#C8F542"/>
    <circle cx="604" cy="204" r="1.8" fill="#C8F542"/>
    <circle cx="628" cy="204" r="1.8" fill="#C8F542"/>
    <circle cx="580" cy="228" r="1.8" fill="#C8F542"/>
    <circle cx="604" cy="228" r="1.8" fill="#C8F542"/>
    <circle cx="628" cy="228" r="1.8" fill="#C8F542"/>
    <circle cx="580" cy="252" r="1.8" fill="#C8F542"/>
    <circle cx="604" cy="252" r="1.8" fill="#C8F542"/>
    <circle cx="628" cy="252" r="1.8" fill="#C8F542"/>
  </g>

</svg>
