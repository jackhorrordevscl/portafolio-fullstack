<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/isotipo.png" />
    <link rel="apple-touch-icon" href="/isotipo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- META TAGS PRIMARIOS -->
    <!-- title, description, canonical, og:* y twitter:* se inyectan por ruta -->
    <!-- vía SeoHead (react-helmet-async); ver src/components/SeoHead.tsx -->
    <meta
      name="keywords"
      content="ground zero devs, desarrollo fullstack, react, nodejs, typescript, nestjs, estudio de software, chile, santiago"
    />
    <meta name="author" content="Ground Zero Devs" />
    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CL" />
    <meta property="og:site_name" content="Ground Zero Devs" />
    <meta property="twitter:card" content="summary_large_image" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Color -->
    <meta name="theme-color" content="#0C0F14" />
    <meta name="msapplication-navbutton-color" content="#0C0F14" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
